# Default values for threat-engine.
#
# The daemon is safe by default: it populates the kernel ipset tables but does
# NOT attach any iptables rules, so installing this chart cannot drop traffic.
# Enforcement is enabled with `enforcement.enabled=true` or at runtime via the
# loopback-only admin endpoint (see the chart NOTES).

# Enforcement gates whether the hostile DROP rules are attached to
# raw:PREROUTING. Disabled means the ipsets are still populated and /check and
# the metrics still work, but no packets are filtered.
enforcement:
  enabled: false

# Kernel ipset table names. Changing these after install leaves the old tables
# behind; clean them up manually with `ipset destroy`.
sets:
  hostileName: threat_engine_hostile_ips
  whitelistName: threat_engine_whitelist_ips

scan:
  # Polling frequency for threat feeds, in minutes.
  intervalMinutes: 5
  # Minimum score for confidence-weighted feeds such as IPsum.
  confidenceThreshold: 3

# Extra IPs/CIDRs that must never be blocked, in addition to the RFC 1918 and
# link-local ranges the daemon always excludes.
whitelist: []

http:
  port: 9090

# The admin listener binds 127.0.0.1 only, so it is reachable from the host or
# from inside the pod, never from another pod or off-host. Use
# `kubectl port-forward` or `kubectl exec` to reach it.
admin:
  port: 9091
  # Path of the admin unix domain socket inside the container. The socket is
  # the preferred control surface: it needs no port and can be restricted by
  # filesystem permissions.
  socketPath: /var/run/threat-engine/admin.sock
  # Directory the socket is placed in. When `socketHostPath` is set, this
  # directory is a hostPath volume, so the socket is reachable from the node
  # itself (e.g. `threat-engine enforce status` run on the host).
  socketDir: /var/run/threat-engine
  # Optional hostPath directory backing socketDir. Leave empty to keep the
  # socket inside the pod's filesystem only.
  socketHostPath: ""
  # Lock runtime enforcement changes. When true, ENFORCEMENT_ENABLED is
  # sourced from a ConfigMap and the admin socket refuses toggles, so the
  # operator changes enforcement by editing the ConfigMap and restarting the
  # pods — nothing can flip the firewall behind their back.
  enforcementLocked: false
  # Name of the ConfigMap holding the ENFORCEMENT_ENABLED key. Created by this
  # chart when empty.
  enforcementConfigMap: ""

image:
  repository: ghcr.io/hekemen/threat-engine
  tag: ""          # defaults to .Chart.appVersion when empty
  pullPolicy: IfNotPresent

imagePullSecrets: []

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

# The daemon must be able to reach every node, including tainted ones, or the
# firewall will be missing on exactly the nodes an operator forgot about.
tolerations:
  - operator: Exists

nodeSelector: {}

affinity: {}

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# Requires the Prometheus Operator CRDs. Rendered only when enabled.
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# The daemon needs no Kubernetes API access to do its job; the ServiceAccount
# exists so it does not run as the namespace default. Set this only if you are
# adding your own RBAC or a sidecar that needs it.
rbac:
  create: false

podAnnotations: {}
podLabels: {}
