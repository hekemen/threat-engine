{{- if .Values.rbac.create }}
{{/*
  The daemon needs no Kubernetes API access to enforce firewall rules; it works
  entirely through the host kernel. This Role exists so that operators who add
  their own sidecars or future features have a labelled place to extend, and is
  rendered only when rbac.create=true.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "threat-engine.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "threat-engine.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "threat-engine.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "threat-engine.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "threat-engine.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "threat-engine.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
