apiVersion: v1
kind: Service
metadata:
  name: {{ include "thread-engine.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thread-engine.labels" . | nindent 4 }}
spec:
  # ClusterIP only: this exposes the read-only metrics/health surface.
  # The admin toggle port is deliberately not in this Service, because the
  # daemon binds it to 127.0.0.1 on each node.
  type: ClusterIP
  selector:
    {{- include "thread-engine.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.http.port }}
      targetPort: http
      protocol: TCP
